<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Viewer</title>

<!--
  iOS Safari compatibility notes:
  1. importmap — поддерживается только с iOS 16.4+. Для iOS <16.4 используем fallback
     через legacy UMD сборку Three.js, подключённую обычным <script>.
  2. OrbitControls / GLTFLoader — на iOS <16.4 тоже грузим UMD версии.
  3. WebGL context — iOS Safari убивает контекст при уходе в фон (visibilitychange).
     Нужно восстанавливать его явно.
  4. backdrop-filter blur — поддерживается через -webkit-backdrop-filter.
  5. touch-action — нужен на canvas чтобы OrbitControls получал touch-события.
  6. iOS не позволяет autoplay аудио и некоторые WebGL расширения — не критично.
  7. Размер canvas: на iOS window.innerHeight включает адресную строку — используем
     visualViewport для точных размеров.
-->
<script>
// Определяем поддержку importmap (iOS 16.4+, Safari 16.4+)
window.__supportsImportMap = false;
try {
  const s = document.createElement('script');
  s.type = 'importmap';
  // Если браузер выбрасывает — не поддерживает
  if (HTMLScriptElement.supports && HTMLScriptElement.supports('importmap')) {
    window.__supportsImportMap = true;
  }
} catch(e) {}
</script>

<!-- importmap только для браузеров с поддержкой -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --panel: rgba(16,16,20,0.82);
    --border: rgba(255,255,255,0.08);
    --text: #e8e6e0;
    --muted: #7a7870;
    --accent: #4f8ef7;
    --accent2: #2dd4bf;
    --danger: #f97316;
    --radius: 10px;
    --font: 'DM Mono', 'Fira Mono', monospace;
  }

  body {
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font);
    color: var(--text);
  }

  canvas {
    display: block;
    touch-action: none;
    -webkit-touch-callout: none;
  }

  /* ── Overlay panels ── */
  .panel {
    position: absolute;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  /* ── Top-left info ── */
  #info {
    top: 14px; left: 14px;
    padding: 8px 14px;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 160px;
  }
  #info .model-name {
    font-size: 12px;
    color: var(--text);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 220px;
  }
  #info .dims { font-size: 10px; color: var(--muted); letter-spacing: 0.04em; }

  /* ── Status bar ── */
  #status {
    top: 14px; left: 50%; transform: translateX(-50%);
    padding: 7px 18px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--accent);
    white-space: nowrap;
    transition: opacity 0.4s;
  }
  #status.hidden { opacity: 0; pointer-events: none; }

  /* ── Top-right toolbar ── */
  #toolbar {
    top: 14px; right: 14px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .tb-group {
    display: flex;
    gap: 4px;
  }

  .tb-btn {
    width: 36px; height: 36px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    font-family: var(--font);
    flex-shrink: 0;
  }
  .tb-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  .tb-btn.active { background: rgba(79,142,247,0.15); color: var(--accent); border-color: rgba(79,142,247,0.4); }
  .tb-btn[title] { position: relative; }

  .tb-sep { width: 1px; background: var(--border); margin: 4px 2px; }

  /* ── Bottom controls ── */
  #controls {
    bottom: max(20px, env(safe-area-inset-bottom, 20px));
    left: 50%; transform: translateX(-50%);
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: min(560px, 92vw);
    max-width: 640px;
    width: 92vw;
  }

  #controls.disabled { opacity: 0.4; pointer-events: none; }

  .ctrl-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .ctrl-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--muted);
    min-width: 36px;
    text-transform: uppercase;
  }

  /* Axis selector */
  .axis-group {
    display: flex;
    gap: 4px;
  }
  .axis-btn {
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: var(--font);
    font-size: 11px;
    letter-spacing: 0.06em;
    transition: all 0.15s;
  }
  .axis-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
  .axis-btn.active { background: rgba(79,142,247,0.15); color: var(--accent); border-color: rgba(79,142,247,0.4); }

  /* Slider */
  .slider-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 3px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(79,142,247,0.25);
    cursor: grab;
    transition: box-shadow 0.15s;
  }
  input[type=range]:active::-webkit-slider-thumb { cursor: grabbing; box-shadow: 0 0 0 5px rgba(79,142,247,0.3); }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: grab;
  }

  .slider-val {
    font-size: 10px;
    color: var(--muted);
    min-width: 44px;
    text-align: right;
    letter-spacing: 0.04em;
  }

  /* Render mode */
  .mode-group {
    display: flex;
    gap: 4px;
  }
  .mode-btn {
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: var(--font);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: all 0.15s;
  }
  .mode-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
  .mode-btn.active { background: rgba(45,212,191,0.12); color: var(--accent2); border-color: rgba(45,212,191,0.35); }

  /* Toggle switch */
  .toggle-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .toggle-track {
    width: 28px; height: 16px;
    border-radius: 8px;
    background: rgba(255,255,255,0.12);
    border: 1px solid var(--border);
    position: relative;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .toggle-track.on { background: rgba(79,142,247,0.5); border-color: rgba(79,142,247,0.6); }
  .toggle-thumb {
    position: absolute;
    top: 2px; left: 2px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s;
  }
  .toggle-track.on .toggle-thumb { transform: translateX(12px); }
  .toggle-label { font-size: 10px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }

  /* Invert button */
  .invert-btn {
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: var(--font);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: all 0.15s;
  }
  .invert-btn:hover { color: var(--danger); border-color: rgba(249,115,22,0.4); background: rgba(249,115,22,0.08); }

  /* Progress bar */
  #progress-wrap {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: transparent;
    z-index: 100;
    pointer-events: none;
  }
  #progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    width: 0%;
    transition: width 0.1s;
  }

  /* Tooltip */
  .tooltip {
    position: absolute;
    right: 50px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 10px;
    color: var(--text);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    transform: translateY(-50%);
    letter-spacing: 0.05em;
  }

  /* Error state */
  #error {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    display: none;
  }
  #error .err-title { font-size: 14px; color: var(--danger); letter-spacing: 0.06em; margin-bottom: 8px; }
  #error .err-sub { font-size: 11px; color: var(--muted); }


</style>
</head>
<body>

<div id="progress-wrap"><div id="progress-bar"></div></div>

<!-- Info panel -->
<div id="info" class="panel">
  <span class="model-name" id="model-name">—</span>
  <span class="dims" id="dims"></span>
</div>

<!-- Status -->
<div id="status" class="panel">ЗАГРУЗКА...</div>

<!-- Toolbar (top-right) -->
<div id="toolbar" class="panel">
  <div class="tb-group">
    <button class="tb-btn" id="btn-reset" title="Сбросить камеру">⌂</button>
    <button class="tb-btn" id="btn-ortho" title="Ортогональная проекция">⊡</button>
    <button class="tb-btn" id="btn-grid" title="Сетка пола">⊞</button>
    <button class="tb-btn" id="view-xy" title="Вид XY">XY</button>
    <button class="tb-btn" id="view-xz" title="Вид XZ">XZ</button>
    <button class="tb-btn" id="view-yz" title="Вид YZ">YZ</button>
  </div>
</div>

<!-- Bottom controls -->
<div id="controls" class="panel disabled">

  <!-- Render mode -->
  <div class="ctrl-row">
    <span class="ctrl-label">Вид</span>
    <div class="mode-group">
      <button class="mode-btn active" data-mode="solid">Solid</button>
      <button class="mode-btn" data-mode="edges">Рёбра</button>
      <button class="mode-btn" data-mode="wireframe">Каркас</button>
    </div>
  </div>

  <!-- Clipping axis -->
  <div class="ctrl-row">
    <span class="ctrl-label">Срез</span>
    <div class="axis-group">
      <button class="axis-btn active" data-axis="none">Нет</button>
      <button class="axis-btn" data-axis="xy">XY</button>
      <button class="axis-btn" data-axis="xz">XZ</button>
      <button class="axis-btn" data-axis="yz">YZ</button>
    </div>
    <button class="invert-btn" id="invertBtn">↔ Инверт</button>
  </div>

  <!-- Clip slider -->
  <div class="ctrl-row" id="clip-row" style="display:none;">
    <span class="ctrl-label">Позиция</span>
    <div class="slider-wrap">
      <input type="range" id="clipSlider">
      <span class="slider-val" id="sliderVal">0.0</span>
    </div>
    <label class="toggle-wrap" id="planeToggle">
      <div class="toggle-track" id="toggleTrack">
        <div class="toggle-thumb"></div>
      </div>
      <span class="toggle-label">Плоскость</span>
    </label>
  </div>

</div>

<!-- Error -->
<div id="error">
  <div class="err-title">ОШИБКА ЗАГРУЗКИ</div>
  <div class="err-sub" id="err-sub">Файл не найден или повреждён</div>
</div>

<!-- UMD fallback для iOS < 16.4 (нет поддержки importmap) -->
<script>
(function() {
  // Проверяем нужен ли fallback
  var needsFallback = !(HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'));
  if (!needsFallback) return;

  // Загружаем UMD сборки синхронно через document.write (до DOMContentLoaded)
  var base = 'https://cdn.jsdelivr.net/npm/three@0.160.0/';
  var scripts = [
    base + 'build/three.min.js',
    base + 'examples/js/controls/OrbitControls.js',
    base + 'examples/js/loaders/GLTFLoader.js',
  ];
  scripts.forEach(function(src) {
    document.write('<script src="' + src + '"><\/script>');
  });
  window.__umdFallback = true;
})();
</script>

<script type="module">
// ── iOS / Safari compat: dynamic import с fallback на UMD globals ──────────
let THREE, OrbitControls, GLTFLoader;

if (window.__umdFallback) {
  // UMD globals уже загружены через <script> выше
  THREE = window.THREE;
  OrbitControls = window.THREE.OrbitControls;
  GLTFLoader = window.THREE.GLTFLoader;
} else {
  // Нормальный ESM путь
  const threeModule = await import('three');
  THREE = threeModule;

  const [oc, gl] = await Promise.all([
    import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js'),
    import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js'),
  ]);
  OrbitControls = oc.OrbitControls;
  GLTFLoader = gl.GLTFLoader;
}

// ── Helpers: viewport size (iOS Safari учитывает адресную строку) ──────────
function vw() {
  return window.visualViewport ? window.visualViewport.width : window.innerWidth;
}
function vh() {
  return window.visualViewport ? window.visualViewport.height : window.innerHeight;
}

// ── State ───────────────────────────────────────────────────────────────────
let meshes = [];
let edgeObjects = [];
let planeMesh = null;
let modelBox = null;
let defaultCameraPos = new THREE.Vector3();
let defaultTarget = new THREE.Vector3();
let isOrtho = false;
let showPlaneVis = false;
let clipActive = false;
let inverted = false;

// ── Scene ────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d0f);

const grid = new THREE.GridHelper(100, 40, 0x1f1f2a, 0x1a1a22);
grid.visible = true;
scene.add(grid);

// ── Cameras ──────────────────────────────────────────────────────────────────
const perspCam = new THREE.PerspectiveCamera(50, vw() / vh(), 0.01, 100000);
const orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 100000);
let camera = perspCam;

function updateOrthoFrustum() {
  const aspect = vw() / vh();
  const d = perspCam.position.distanceTo(controls.target) * Math.tan(THREE.MathUtils.degToRad(perspCam.fov / 2));
  orthoCam.left = -d * aspect; orthoCam.right = d * aspect;
  orthoCam.top = d; orthoCam.bottom = -d;
  orthoCam.position.copy(perspCam.position);
  orthoCam.quaternion.copy(perspCam.quaternion);
  orthoCam.updateProjectionMatrix();
}

// ── Renderer ─────────────────────────────────────────────────────────────────
// iOS: powerPreference + failIfMajorPerformanceCaveat убраны — могут блокировать
// создание контекста на старых устройствах
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false,
  // iOS Safari: явно запрашиваем WebGL1 совместимость если WebGL2 недоступен
  // Three.js r160 сам выбирает WebGL2 → WebGL1 → ошибка
});
renderer.setSize(vw(), vh());
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.localClippingEnabled = true;
document.body.prepend(renderer.domElement);

// ── iOS: восстановление WebGL контекста ──────────────────────────────────────
// iOS Safari убивает WebGL контекст при уходе приложения в фон.
// При возвращении нужно явно перезапустить рендер.
renderer.domElement.addEventListener('webglcontextlost', (e) => {
  e.preventDefault(); // обязательно — иначе контекст не восстановится
  setStatus('КОНТЕКСТ ПОТЕРЯН...');
}, false);

renderer.domElement.addEventListener('webglcontextrestored', () => {
  // Three.js r150+ восстанавливает контекст автоматически при наличии этого обработчика
  setStatus('ВОССТАНОВЛЕНО', true);
  animate();
}, false);

// При возвращении из фона на iOS — перерисовываем
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) renderer.render(scene, camera);
});

// ── Lights ────────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.7));

const keyLight = new THREE.DirectionalLight(0xfff4e0, 1.2);
keyLight.position.set(8, 14, 10);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xc0d8ff, 0.4);
fillLight.position.set(-8, -4, -8);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0x4f8ef7, 0.3);
rimLight.position.set(0, -10, -5);
scene.add(rimLight);

// ── Controls ──────────────────────────────────────────────────────────────────
let controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.zoomSpeed = 0.8;
// iOS: OrbitControls использует pointer events — убеждаемся что они включены
controls.enablePan = true;
controls.enableZoom = true;
controls.enableRotate = true;

function setOrthoView(axis) {
  if (!modelBox) return;

  const center = new THREE.Vector3(0, 0, 0);
  const size = modelBox.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const dist = maxDim * 2;

  let pos = new THREE.Vector3();
  let up = new THREE.Vector3(0, 1, 0);

  if (axis === 'xy') {
    pos.set(0, 0, dist);
    up.set(0, 1, 0);
  }
  if (axis === 'xz') {
    pos.set(0, dist, 0);
    up.set(0, 0, -1);
  }
  if (axis === 'yz') {
    pos.set(dist, 0, 0);
    up.set(0, 1, 0);
  }

  // если не в орто — включаем
  if (!isOrtho) {
    document.getElementById('btn-ortho').click();
  }

  camera.position.copy(pos);
  camera.up.copy(up);
  camera.lookAt(center);

  controls.target.copy(center);
  controls.update();
}

// ── Clipping plane ────────────────────────────────────────────────────────────
const clipPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

// ── UI elements ───────────────────────────────────────────────────────────────
const progressBar = document.getElementById('progress-bar');
const statusEl = document.getElementById('status');
const modelNameEl = document.getElementById('model-name');
const dimsEl = document.getElementById('dims');
const controlsPanel = document.getElementById('controls');
const clipSlider = document.getElementById('clipSlider');
const sliderVal = document.getElementById('sliderVal');
const clipRow = document.getElementById('clip-row');
const toggleTrack = document.getElementById('toggleTrack');
const errorEl = document.getElementById('error');

function setStatus(msg, hide = false) {
  statusEl.textContent = msg;
  statusEl.classList.remove('hidden');
  if (hide) setTimeout(() => statusEl.classList.add('hidden'), 1800);
}

// ── Axis buttons ──────────────────────────────────────────────────────────────
const axisNormals = {
  xy: new THREE.Vector3(0, 0, 1),
  xz: new THREE.Vector3(0, 1, 0),
  yz: new THREE.Vector3(1, 0, 0),
};

document.getElementById('view-xy').addEventListener('click', () => setOrthoView('xy'));
document.getElementById('view-xz').addEventListener('click', () => setOrthoView('xz'));
document.getElementById('view-yz').addEventListener('click', () => setOrthoView('yz'));
document.querySelectorAll('.axis-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.axis-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const axis = btn.dataset.axis;

    if (axis === 'none') {
      clipActive = false;
      clipRow.style.display = 'none';
      meshes.forEach(m => { m.material.clippingPlanes = []; });
      edgeObjects.forEach(e => { e.material.clippingPlanes = []; });
      if (planeMesh) planeMesh.visible = false;
      return;
    }

    clipActive = true;
    clipRow.style.display = 'flex';
    inverted = false;

    clipPlane.normal.copy(axisNormals[axis]);
    clipPlane.constant = 0;
    clipSlider.value = 0;
    sliderVal.textContent = '0.0';

    alignPlaneMesh(axis);

    meshes.forEach(m => { m.material.clippingPlanes = [clipPlane]; });
    edgeObjects.forEach(e => { e.material.clippingPlanes = [clipPlane]; });
    if (planeMesh) planeMesh.visible = showPlaneVis;
  });
});

function alignPlaneMesh(axis) {
  if (!planeMesh) return;
  if (axis === 'xy') planeMesh.rotation.set(0, 0, 0);
  if (axis === 'xz') planeMesh.rotation.set(Math.PI / 2, 0, 0);
  if (axis === 'yz') planeMesh.rotation.set(0, Math.PI / 2, 0);
}

clipSlider.addEventListener('input', () => {
  const v = Number(clipSlider.value);
  clipPlane.constant = inverted ? -v : v;
  sliderVal.textContent = v.toFixed(1);
});

document.getElementById('invertBtn').addEventListener('click', () => {
  inverted = !inverted;
  const v = Number(clipSlider.value);
  clipPlane.normal.multiplyScalar(-1);
  clipPlane.constant = inverted ? -v : v;
});

document.getElementById('planeToggle').addEventListener('click', () => {
  showPlaneVis = !showPlaneVis;
  toggleTrack.classList.toggle('on', showPlaneVis);
  if (planeMesh) planeMesh.visible = showPlaneVis && clipActive;
});

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const mode = btn.dataset.mode;
    meshes.forEach(m => { m.material.wireframe = (mode === 'wireframe'); });
    edgeObjects.forEach(e => { e.visible = (mode === 'edges'); });
  });
});

document.getElementById('btn-reset').addEventListener('click', () => {
  perspCam.position.copy(defaultCameraPos);
  controls.target.copy(defaultTarget);
  controls.update();
  setStatus('КАМЕРА СБРОШЕНА', true);
});

document.getElementById('btn-ortho').addEventListener('click', () => {

  isOrtho = !isOrtho;
  document.getElementById('btn-ortho').classList.toggle('active', isOrtho);

  // сохраняем состояние
  const pos = camera.position.clone();
  const quat = camera.quaternion.clone();
  const target = controls.target.clone();

  // переключаем камеру
  camera = isOrtho ? orthoCam : perspCam;

  // восстанавливаем состояние
  camera.position.copy(pos);
  camera.quaternion.copy(quat);

  if (isOrtho) {
    updateOrthoFrustum();
  } else {
    camera.updateProjectionMatrix();
  }

  // 🔥 УБИВАЕМ старые контролы
  controls.dispose();

  // 🔥 СОЗДАЁМ заново
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;

  // 🔥 ВОССТАНАВЛИВАЕМ target
  controls.target.copy(target);
  controls.update();

  setStatus(
    isOrtho ? 'ОРТОГОНАЛЬНАЯ ПРОЕКЦИЯ' : 'ПЕРСПЕКТИВНАЯ ПРОЕКЦИЯ',
    true
  );
});

document.getElementById('btn-grid').addEventListener('click', () => {
  grid.visible = !grid.visible;
  document.getElementById('btn-grid').classList.toggle('active', grid.visible);
});

// ── Запуск ────────────────────────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const initialModel = params.get('model');

if (initialModel) {
  loadModel(initialModel);
} else {
  setStatus('НЕТ МОДЕЛИ — ПРОВЕРЬТЕ QR-КОД');
}

function loadModel(src) {
  meshes.forEach(m => { try { m.geometry.dispose(); m.material.dispose(); } catch(e){} });
  edgeObjects.forEach(e => { try { e.geometry.dispose(); e.material.dispose(); } catch(e){} });
  meshes = []; edgeObjects = [];

  scene.children
    .filter(c => c.userData.isModel)
    .forEach(c => scene.remove(c));

  if (planeMesh) { scene.remove(planeMesh); planeMesh = null; }

  document.querySelectorAll('.axis-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.axis-btn[data-axis="none"]').classList.add('active');
  clipActive = false;
  clipRow.style.display = 'none';

  controlsPanel.classList.add('disabled');
  errorEl.style.display = 'none';
  progressBar.style.width = '0%';
  setStatus('ЗАГРУЗКА...');

  document.getElementById('model-name').textContent = src.split('/').pop().split('?')[0];

  const loader = new GLTFLoader();

  loader.load(
    src,
    (gltf) => {
      const model = gltf.scene;
      model.userData.isModel = true;
      scene.add(model);

      model.traverse(child => {
        if (!child.isMesh) return;

        // iOS: некоторые материалы из GLTF могут использовать расширения,
        // недоступные на iOS WebGL1. Делаем fallback на MeshStandardMaterial.
        if (!child.material) {
          child.material = new THREE.MeshStandardMaterial({ color: 0x888888 });
        }

        if (!child.material.clippingPlanes) child.material.clippingPlanes = [];

        meshes.push(child);

        const edgesGeo = new THREE.EdgesGeometry(child.geometry, 15);
        const edgesMat = new THREE.LineBasicMaterial({
          color: 0x4f8ef7,
          clippingPlanes: [],
          transparent: true,
          opacity: 0.7
        });
        const edgeLines = new THREE.LineSegments(edgesGeo, edgesMat);
        edgeLines.visible = false;
        child.add(edgeLines);
        child.userData.edgeLines = edgeLines;
        edgeObjects.push(edgeLines);
      });

      const box = new THREE.Box3().setFromObject(model);
      modelBox = box;
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);

      model.position.sub(center);

      dimsEl.textContent = `${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)}`;

      const bottom = box.min.y - center.y;
      grid.position.y = bottom;

      const planeSize = maxDim * 1.5;
      planeMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(planeSize, planeSize),
        new THREE.MeshBasicMaterial({
          color: 0x4f8ef7,
          transparent: true,
          opacity: 0.12,
          side: THREE.DoubleSide,
          depthWrite: false,
        })
      );
      planeMesh.visible = false;
      scene.add(planeMesh);

      const half = maxDim / 2;
      clipSlider.min = -half;
      clipSlider.max = half;
      clipSlider.step = maxDim / 400;
      clipSlider.value = 0;

      const dist = maxDim * 2.2;
      defaultCameraPos.set(dist * 0.7, dist * 0.5, dist);
      defaultTarget.set(0, 0, 0);
      perspCam.position.copy(defaultCameraPos);
      perspCam.near = maxDim * 0.001;
      perspCam.far = maxDim * 100;
      perspCam.updateProjectionMatrix();
      controls.target.copy(defaultTarget);
      controls.update();

      progressBar.style.width = '100%';
      setTimeout(() => { progressBar.style.width = '0%'; }, 600);

      controlsPanel.classList.remove('disabled');
      setStatus('ГОТОВО', true);
    },
    (xhr) => {
      if (xhr.total > 0) {
        const pct = (xhr.loaded / xhr.total * 100).toFixed(0);
        progressBar.style.width = pct + '%';
        setStatus(`ЗАГРУЗКА ${pct}%`);
      }
    },
    (err) => {
      progressBar.style.width = '0%';
      statusEl.classList.add('hidden');
      errorEl.style.display = 'block';
      document.getElementById('err-sub').textContent = err.message || 'Файл не найден или повреждён';
      console.error('GLTFLoader error:', err);
    }
  );
}

// ── Animate ───────────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);

  if (isOrtho) updateOrthoFrustum();

  if (planeMesh && clipActive) {
    planeMesh.position.copy(clipPlane.normal).multiplyScalar(-clipPlane.constant);
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

// ── Resize (с поддержкой visualViewport на iOS) ────────────────────────────
function onResize() {
  const w = vw(), h = vh();
  perspCam.aspect = w / h;
  perspCam.updateProjectionMatrix();
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
}

window.addEventListener('resize', onResize);

// iOS: адресная строка появляется/скрывается — visualViewport меняет размер
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', onResize);
}

</script>
