<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Viewer</title>
<script>
if (HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'))
  window.__supportsImportMap = true;
</script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d0d0f; --panel: rgba(16,16,20,0.82); --border: rgba(255,255,255,0.08);
  --text: #e8e6e0; --muted: #7a7870; --accent: #4f8ef7; --accent2: #2dd4bf;
  --danger: #f97316; --radius: 10px; --font: 'DM Mono','Fira Mono',monospace;
}
body { margin:0; overflow:hidden; background:var(--bg); font-family:var(--font); color:var(--text); }
canvas { display:block; touch-action:none; -webkit-touch-callout:none; }
.panel {
  position:absolute; background:var(--panel); border:1px solid var(--border);
  border-radius:var(--radius); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
#info { top:14px; left:14px; padding:8px 14px; font-size:11px; letter-spacing:.06em; color:var(--muted); display:flex; flex-direction:column; gap:2px; min-width:160px; }
#info .model-name { font-size:12px; color:var(--text); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px; }
#info .dims { font-size:10px; color:var(--muted); letter-spacing:.04em; }
#status { top:14px; left:50%; transform:translateX(-50%); padding:7px 18px; font-size:11px; letter-spacing:.08em; color:var(--accent); white-space:nowrap; transition:opacity .4s; }
#status.hidden { opacity:0; pointer-events:none; }
#toolbar { top:14px; right:14px; padding:6px; display:flex; flex-direction:column; gap:4px; }
.tb-group { display:flex; gap:4px; }
.tb-divider { height:1px; background:var(--border); margin:2px 0; }
.tb-btn {
  width:36px; height:36px; border:1px solid var(--border); border-radius:8px;
  background:transparent; color:var(--muted); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; letter-spacing:.03em; font-family:var(--font); flex-shrink:0;
  transition:background .12s,color .12s,border-color .12s,transform .08s;
}
.tb-btn:hover { background:rgba(255,255,255,.06); color:var(--text); }
.tb-btn:active { transform:scale(.93); }
.tb-btn.active { background:rgba(79,142,247,.15); color:var(--accent); border-color:rgba(79,142,247,.4); }
.tb-btn.view-btn { font-size:10px; letter-spacing:.06em; }
.tb-btn.view-btn.active { background:rgba(45,212,191,.12); color:var(--accent2); border-color:rgba(45,212,191,.35); }
#controls {
  bottom:max(20px,env(safe-area-inset-bottom,20px)); left:50%; transform:translateX(-50%);
  padding:16px 20px; display:flex; flex-direction:column; gap:12px;
  min-width:min(560px,92vw); max-width:640px; width:92vw;
}
#controls.disabled { opacity:.4; pointer-events:none; }
.ctrl-row { display:flex; align-items:center; gap:12px; }
.ctrl-label { font-size:10px; letter-spacing:.1em; color:var(--muted); min-width:36px; text-transform:uppercase; }
.axis-group { display:flex; gap:4px; }

/* Кнопки осей — теперь toggles, не radio. Активные подсвечены */
.axis-btn {
  padding:5px 12px; border:1px solid var(--border); border-radius:6px;
  background:transparent; color:var(--muted); cursor:pointer;
  font-family:var(--font); font-size:11px; letter-spacing:.06em; transition:all .15s;
  user-select:none;
}
.axis-btn:hover { color:var(--text); border-color:rgba(255,255,255,.2); }
.axis-btn.active { background:rgba(79,142,247,.15); color:var(--accent); border-color:rgba(79,142,247,.4); }

/* Строки срезов — по одной на каждую ось */
.clip-axis-row { display:flex; flex-direction:column; gap:8px; }

.slider-wrap { flex:1; display:flex; align-items:center; gap:10px; }
input[type=range] {
  -webkit-appearance:none; appearance:none; flex:1; height:3px;
  background:rgba(255,255,255,.1); border-radius:2px; outline:none; cursor:pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
  background:var(--accent); box-shadow:0 0 0 3px rgba(79,142,247,.25); cursor:grab;
}
input[type=range]:active::-webkit-slider-thumb { cursor:grabbing; box-shadow:0 0 0 5px rgba(79,142,247,.3); }
input[type=range]::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:var(--accent); border:none; }
#explodeSlider::-webkit-slider-thumb { background:var(--danger); box-shadow:0 0 0 3px rgba(249,115,22,.25); }
#explodeSlider:active::-webkit-slider-thumb { box-shadow:0 0 0 5px rgba(249,115,22,.3); }
#explodeSlider::-moz-range-thumb { background:var(--danger); }
.slider-val { font-size:10px; color:var(--muted); min-width:44px; text-align:right; letter-spacing:.04em; }
.mode-group { display:flex; gap:4px; }
.mode-btn {
  padding:5px 10px; border:1px solid var(--border); border-radius:6px;
  background:transparent; color:var(--muted); cursor:pointer;
  font-family:var(--font); font-size:10px; letter-spacing:.06em; text-transform:uppercase; transition:all .15s;
}
.mode-btn:hover { color:var(--text); border-color:rgba(255,255,255,.2); }
.mode-btn.active { background:rgba(45,212,191,.12); color:var(--accent2); border-color:rgba(45,212,191,.35); }
.toggle-wrap { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; }
.toggle-track { width:28px; height:16px; border-radius:8px; background:rgba(255,255,255,.12); border:1px solid var(--border); position:relative; transition:background .2s; flex-shrink:0; }
.toggle-track.on { background:rgba(79,142,247,.5); border-color:rgba(79,142,247,.6); }
.toggle-thumb { position:absolute; top:2px; left:2px; width:10px; height:10px; border-radius:50%; background:#fff; transition:transform .2s; }
.toggle-track.on .toggle-thumb { transform:translateX(12px); }
.toggle-label { font-size:10px; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; }
.invert-btn {
  padding:5px 8px; border:1px solid var(--border); border-radius:6px;
  background:transparent; color:var(--muted); cursor:pointer;
  font-family:var(--font); font-size:10px; letter-spacing:.04em; text-transform:uppercase; transition:all .15s;
  flex-shrink:0;
}
.invert-btn:hover { color:var(--danger); border-color:rgba(249,115,22,.4); background:rgba(249,115,22,.08); }
/* ── Сворачивание тулбара ── */
#toolbar-body {
  display: flex; flex-direction: column; gap: 4px;
  overflow: hidden;
  max-height: 200px;
  transition: max-height 0.25s ease, opacity 0.2s ease, margin-top 0.25s ease;
  opacity: 1;
}
#toolbar.collapsed #toolbar-body {
  max-height: 0;
  opacity: 0;
  margin-top: 0;
}
#toolbar-body { margin-top: 4px; }

/* кнопка сворачивания тулбара */
#btn-toolbar-toggle {
  width: 36px; height: 20px;
  border: none; border-radius: 6px;
  background: transparent; color: var(--muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-family: var(--font);
  transition: color .15s;
  align-self: center;
}
#btn-toolbar-toggle:hover { color: var(--text); }

/* ── Сворачивание нижней панели ── */
#controls-body {
  display: flex; flex-direction: column; gap: 12px;
  overflow: hidden;
  max-height: 400px;
  transition: max-height 0.25s ease, opacity 0.2s ease;
  opacity: 1;
}
#controls.collapsed #controls-body {
  max-height: 0;
  opacity: 0;
}

/* заголовок нижней панели — всегда виден */
#controls-header {
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; user-select: none;
  padding: 2px 0;
}
#controls-header-label {
  font-size: 10px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase;
}
#btn-controls-toggle {
  font-size: 11px; color: var(--muted); background: none; border: none;
  cursor: pointer; font-family: var(--font);
  transition: color .15s, transform .2s;
  padding: 0 2px;
}
#btn-controls-toggle:hover { color: var(--text); }
#controls.collapsed #btn-controls-toggle { transform: rotate(180deg); }
#progress-bar { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); width:0%; transition:width .1s; }
#error { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; display:none; }
#error .err-title { font-size:14px; color:var(--danger); letter-spacing:.06em; margin-bottom:8px; }
#error .err-sub { font-size:11px; color:var(--muted); }
</style>
</head>
<body>
<div id="progress-wrap"><div id="progress-bar"></div></div>
<div id="info" class="panel">
  <span class="model-name" id="model-name">—</span>
  <span class="dims" id="dims"></span>
</div>
<div id="status" class="panel">ЗАГРУЗКА...</div>
<div id="toolbar" class="panel">
  <button id="btn-toolbar-toggle" title="Свернуть / развернуть">▲</button>
  <div id="toolbar-body">
    <div class="tb-group">
      <button class="tb-btn" id="btn-reset" title="Сбросить камеру">⌂</button>
      <button class="tb-btn" id="btn-ortho" title="Ортогональная проекция">⊡</button>
      <button class="tb-btn" id="btn-grid" title="Сетка пола">⊞</button>
      <button class="tb-btn" id="btn-bg" title="Светлый / тёмный фон">◐</button>
    </div>
    <div class="tb-divider"></div>
    <div class="tb-group">
      <button class="tb-btn view-btn" id="btn-view-top"   title="Вид сверху / снизу — повторное нажатие переворачивает">ВЕРХ</button>
      <button class="tb-btn view-btn" id="btn-view-front" title="Вид спереди / сзади — повторное нажатие переворачивает">ПЕРЕД</button>
      <button class="tb-btn view-btn" id="btn-view-right" title="Вид справа / слева — повторное нажатие переворачивает">БОК</button>
      <button class="tb-btn" id="btn-fs" title="Полноэкранный режим">⛶</button>
    </div>
  </div>
</div>

<div id="controls" class="panel disabled">

  <!-- Заголовок: всегда виден, клик сворачивает/разворачивает -->
  <div id="controls-header">
    <span id="controls-header-label">Управление</span>
    <button id="btn-controls-toggle" title="Свернуть / развернуть">▼</button>
  </div>

  <div id="controls-body">

  <div class="ctrl-row">
    <span class="ctrl-label">Вид</span>
    <div class="mode-group">
      <button class="mode-btn active" data-mode="solid">Обычный</button>
      <button class="mode-btn" data-mode="edges">Рёбра</button>
      <button class="mode-btn" data-mode="wireframe">Каркас</button>
    </div>
  </div>

  <!--
    Мультиплоскостной срез.
    Каждая ось — независимый toggle с собственным слайдером.
    Можно включить любые 1–3 одновременно.
    Слайдеры появляются только для активных осей.
  -->
  <div class="ctrl-row">
    <span class="ctrl-label">Срез</span>
    <div class="axis-group">
      <button class="axis-btn" data-axis="xy">XY</button>
      <button class="axis-btn" data-axis="xz">XZ</button>
      <button class="axis-btn" data-axis="yz">YZ</button>
    </div>
  </div>

  <!-- Строка режима среза: появляется только когда активны 2+ плоскости -->
  <div class="ctrl-row" id="clip-mode-row" style="display:none;">
    <span class="ctrl-label">Режим</span>
    <div class="mode-group">
      <button class="mode-btn active" id="btn-clip-and">1/4</button>
      <button class="mode-btn"        id="btn-clip-or" >3/4</button>
    </div>
  </div>

  <!-- Слайдер XY — красный -->
  <div class="ctrl-row clip-slider-row" id="clip-row-xy" style="display:none;">
    <span class="ctrl-label" style="font-size:9px;color:#ff3333;">XY</span>
    <div class="slider-wrap">
      <input type="range" id="clipSlider-xy">
      <span class="slider-val" id="sliderVal-xy">0.0</span>
    </div>
    <button class="invert-btn" data-axis="xy">↔</button>
    <label class="toggle-wrap" data-axis-plane="xy">
      <div class="toggle-track" id="toggleTrack-xy"><div class="toggle-thumb"></div></div>
      <span class="toggle-label">Вид</span>
    </label>
  </div>

  <!-- Слайдер XZ — синий -->
  <div class="ctrl-row clip-slider-row" id="clip-row-xz" style="display:none;">
    <span class="ctrl-label" style="font-size:9px;color:#4f8ef7;">XZ</span>
    <div class="slider-wrap">
      <input type="range" id="clipSlider-xz">
      <span class="slider-val" id="sliderVal-xz">0.0</span>
    </div>
    <button class="invert-btn" data-axis="xz">↔</button>
    <label class="toggle-wrap" data-axis-plane="xz">
      <div class="toggle-track" id="toggleTrack-xz"><div class="toggle-thumb"></div></div>
      <span class="toggle-label">Вид</span>
    </label>
  </div>

  <!-- Слайдер YZ — зелёный -->
  <div class="ctrl-row clip-slider-row" id="clip-row-yz" style="display:none;">
    <span class="ctrl-label" style="font-size:9px;color:#33cc66;">YZ</span>
    <div class="slider-wrap">
      <input type="range" id="clipSlider-yz">
      <span class="slider-val" id="sliderVal-yz">0.0</span>
    </div>
    <button class="invert-btn" data-axis="yz">↔</button>
    <label class="toggle-wrap" data-axis-plane="yz">
      <div class="toggle-track" id="toggleTrack-yz"><div class="toggle-thumb"></div></div>
      <span class="toggle-label">Вид</span>
    </label>
  </div>

  <!-- Строка взрыва: появляется только если мешей > 1 -->
  <div class="ctrl-row" id="explode-row" style="display:none;">
    <span class="ctrl-label" style="color:var(--danger);">Взрыв</span>
    <div class="slider-wrap">
      <input type="range" id="explodeSlider" min="0" max="1" step="0.005" value="0">
      <span class="slider-val" id="explodeVal">0%</span>
    </div>
  </div>

  </div><!-- /controls-body -->
</div>

<div id="error">
  <div class="err-title">ОШИБКА ЗАГРУЗКИ</div>
  <div class="err-sub" id="err-sub">Файл не найден или повреждён</div>
</div>

<script>
(function(){
  var needsFallback = !(HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'));
  if (!needsFallback) return;
  var base = 'https://cdn.jsdelivr.net/npm/three@0.160.0/';
  ['build/three.min.js','examples/js/controls/OrbitControls.js','examples/js/loaders/GLTFLoader.js']
    .forEach(function(s){ document.write('<script src="'+base+s+'"><\/script>'); });
  window.__umdFallback = true;
})();
</script>

<script type="module">
let THREE, OrbitControls, GLTFLoader;
if (window.__umdFallback) {
  THREE = window.THREE; OrbitControls = window.THREE.OrbitControls; GLTFLoader = window.THREE.GLTFLoader;
} else {
  THREE = await import('three');
  const [oc,gl] = await Promise.all([
    import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js'),
    import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js'),
  ]);
  OrbitControls = oc.OrbitControls; GLTFLoader = gl.GLTFLoader;
}

const vw = () => window.visualViewport ? window.visualViewport.width  : window.innerWidth;
const vh = () => window.visualViewport ? window.visualViewport.height : window.innerHeight;

// ── State ─────────────────────────────────────────────────────────────────────
let meshes=[], edgeObjects=[], planeMeshes={};
let defaultCameraPos=new THREE.Vector3(), defaultTarget=new THREE.Vector3();
let isOrtho=false, showPlaneVis={xy:false,xz:false,yz:false};
let activeView=null, isLightBg=false;

// ── Мультиплоскостной срез ────────────────────────────────────────────────────
//
// Вместо одной clipPlane — словарь из трёх независимых плоскостей.
// Каждая имеет: объект THREE.Plane, флаг активности, флаг инверсии,
// текущее значение слайдера.
// Активные плоскости собираются в массив и передаются в material.clippingPlanes.

const AXIS_NORMALS = {
  xy: new THREE.Vector3(0, 0, 1),
  xz: new THREE.Vector3(0, 1, 0),
  yz: new THREE.Vector3(1, 0, 0),
};

const clipState = {
  xy: { plane: new THREE.Plane(new THREE.Vector3(0,0,1), 0), active:false, inverted:true, value:0 },
  xz: { plane: new THREE.Plane(new THREE.Vector3(0,1,0), 0), active:false, inverted:true, value:0 },
  yz: { plane: new THREE.Plane(new THREE.Vector3(1,0,0), 0), active:false, inverted:true, value:0 },
};

// Возвращает массив активных плоскостей для передачи в material.clippingPlanes
function getActivePlanes() {
  return Object.values(clipState).filter(s => s.active).map(s => s.plane);
}

// clipIntersection = false → режим И (AND): видно только пересечение (1/4, 1/8 модели)
// clipIntersection = true  → режим ИЛИ (OR): видно объединение (3/4, 7/8 модели)
// Переключается кнопкой «И/ИЛИ» — появляется когда активны 2+ плоскости
let clipIntersectionMode = false;

// Применяет актуальный набор плоскостей и режим ко всем мешам и рёбрам
function updateClippingPlanes() {
  const planes      = getActivePlanes();
  const activeCount = planes.length;

  // Строка режима видна только при 2+ активных плоскостях
  document.getElementById('clip-mode-row').style.display = activeCount >= 2 ? 'flex' : 'none';

  meshes.forEach(m => {
    m.material.clippingPlanes   = planes;
    m.material.clipIntersection = clipIntersectionMode;
  });
  edgeObjects.forEach(e => {
    e.material.clippingPlanes   = planes;
    e.material.clipIntersection = clipIntersectionMode;
  });
}

// Обновляет constant плоскости с учётом инверсии
function updatePlaneConstant(axis) {
  const s = clipState[axis];
  s.plane.constant = s.inverted ? -s.value : s.value;
}

// ── Scene ─────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d0f);
const grid = new THREE.GridHelper(100,40,0x4287f5,0x4287f5);
grid.visible = true;
scene.add(grid);

// ── Camera ────────────────────────────────────────────────────────────────────
const perspCam = new THREE.PerspectiveCamera(50, vw()/vh(), 0.01, 100000);
const camera   = perspCam;

function applyProjection() {
  if (isOrtho) {
    perspCam.userData.savedFov = perspCam.fov;
    const dist  = perspCam.position.distanceTo(controls.target);
    const halfH = dist * Math.tan(THREE.MathUtils.degToRad(perspCam.userData.savedFov/2));
    const halfW = halfH * (vw()/vh());
    perspCam.projectionMatrix.makeOrthographic(-halfW,halfW,halfH,-halfH,perspCam.near,perspCam.far);
    perspCam.projectionMatrixInverse.copy(perspCam.projectionMatrix).invert();
  } else {
    if (perspCam.userData.savedFov) perspCam.fov = perspCam.userData.savedFov;
    perspCam.updateProjectionMatrix();
  }
}

// ── Renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setSize(vw(), vh());
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.localClippingEnabled = true;
document.body.prepend(renderer.domElement);
renderer.domElement.addEventListener('webglcontextlost',    (e)=>{e.preventDefault(); setStatus('КОНТЕКСТ ПОТЕРЯН...');}, false);
renderer.domElement.addEventListener('webglcontextrestored',()=> {setStatus('ВОССТАНОВЛЕНО',true); animate();},           false);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) renderer.render(scene,camera); });

// ── Lights ────────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff,0.7));
const kl=new THREE.DirectionalLight(0xfff4e0,1.2); kl.position.set(8,14,10);   scene.add(kl);
const fl=new THREE.DirectionalLight(0xc0d8ff,0.4); fl.position.set(-8,-4,-8);  scene.add(fl);
const rl=new THREE.DirectionalLight(0x4f8ef7,0.3); rl.position.set(0,-10,-5);  scene.add(rl);

// ── Controls ──────────────────────────────────────────────────────────────────
let controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.zoomSpeed = 0.8;

let cameraAnim = null;
const viewFlipped = { top:false, front:false, right:false };
const viewLabels  = { top:'ВЕРХ', front:'ПЕРЕД', right:'БОК' };

function clearActiveView() {
  document.querySelectorAll('.view-btn').forEach(b => {
    b.classList.remove('active');
    const n = b.id.replace('btn-view-','');
    if (viewLabels[n]) b.textContent = viewLabels[n];
  });
  activeView = null;
  viewFlipped.top=false; viewFlipped.front=false; viewFlipped.right=false;
  if (cameraAnim) { cameraAnim.cancelled=true; cameraAnim=null; }
  controls.enabled = true;
}
controls.addEventListener('start', clearActiveView);

// ── Кнопки осей (toggle) ──────────────────────────────────────────────────────
document.querySelectorAll('.axis-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const axis = btn.dataset.axis;
    const s    = clipState[axis];

    if (s.active) {
      // Выключаем эту ось
      s.active = false;
      btn.classList.remove('active');
      document.getElementById('clip-row-' + axis).style.display = 'none';
      if (planeMeshes[axis]) planeMeshes[axis].visible = false;
    } else {
      // Включаем эту ось
      s.active   = true;
      s.inverted = false;
      s.value    = 0;
      s.plane.normal.copy(AXIS_NORMALS[axis]);
      s.plane.constant = 0;

      // Сбрасываем слайдер и подпись
      const slider = document.getElementById('clipSlider-' + axis);
      const valEl  = document.getElementById('sliderVal-'  + axis);
      if (slider) { slider.value = 0; }
      if (valEl)  { valEl.textContent = '0.0'; }

      btn.classList.add('active');
      document.getElementById('clip-row-' + axis).style.display = 'flex';

      // Визуальная плоскость — если включена
      if (planeMeshes[axis] && showPlaneVis[axis]) planeMeshes[axis].visible = true;
    }

    updateClippingPlanes();
  });
});

// ── Слайдеры срезов ───────────────────────────────────────────────────────────
['xy','xz','yz'].forEach(axis => {
  const slider = document.getElementById('clipSlider-' + axis);
  const valEl  = document.getElementById('sliderVal-'  + axis);

  slider?.addEventListener('input', () => {
    const v = Number(slider.value);
    clipState[axis].value = v;
    updatePlaneConstant(axis);
    valEl.textContent = v.toFixed(1);
  });
});

// ── Кнопки инверсии (по одной на каждую ось) ─────────────────────────────────
document.querySelectorAll('.invert-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const axis = btn.dataset.axis;
    const s    = clipState[axis];
    s.inverted = !s.inverted;
    // Разворачиваем нормаль
    s.plane.normal.multiplyScalar(-1);
    updatePlaneConstant(axis);
    btn.style.color = s.inverted ? 'var(--danger)' : '';
    btn.style.borderColor = s.inverted ? 'rgba(249,115,22,.4)' : '';
  });
});

// ── Переключатели видимости плоскостей ───────────────────────────────────────
document.querySelectorAll('[data-axis-plane]').forEach(wrap => {
  const axis  = wrap.dataset.axisPlane;
  const track = document.getElementById('toggleTrack-' + axis);
  wrap.addEventListener('click', () => {
    showPlaneVis[axis] = !showPlaneVis[axis];
    track?.classList.toggle('on', showPlaneVis[axis]);
    if (planeMeshes[axis]) planeMeshes[axis].visible = showPlaneVis[axis] && clipState[axis].active;
  });
});

// ── Переключатель режима среза И / ИЛИ ───────────────────────────────────────
function setClipMode(isOr) {
  clipIntersectionMode = isOr;
  document.getElementById('btn-clip-and').classList.toggle('active', !isOr);
  document.getElementById('btn-clip-or').classList.toggle('active',   isOr);
  updateClippingPlanes();
  setStatus(isOr ? 'РЕЖИМ: ОБЪЕДИНЕНИЕ (3/4)' : 'РЕЖИМ: ПЕРЕСЕЧЕНИЕ (1/4)', true);
}
document.getElementById('btn-clip-and').addEventListener('click', () => setClipMode(false));
document.getElementById('btn-clip-or').addEventListener('click',  () => setClipMode(true));

// ── Полноэкранный режим ───────────────────────────────────────────────────────
// Fullscreen API работает на всех современных браузерах включая iOS Safari 16.4+
// На более старых iOS Safari полноэкранного API нет — там просто ничего не происходит,
// кнопка не ломает остальное.
document.getElementById('btn-fs').addEventListener('click', async () => {
  const btn = document.getElementById('btn-fs');
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch(e) {
    // iOS Safari не поддерживает Fullscreen API — молча игнорируем
  }
});

// Синхронизируем иконку и состояние кнопки с реальным состоянием fullscreen
// (пользователь может выйти через Esc — нужно отследить)
document.addEventListener('fullscreenchange', () => {
  const btn       = document.getElementById('btn-fs');
  const isFs      = !!document.fullscreenElement;
  btn.textContent = isFs ? '✕' : '⛶';
  btn.classList.toggle('active', isFs);
  // При входе/выходе из fullscreen размер canvas меняется — пересчитываем
  onResize();
});

// ── Сворачивание панелей ──────────────────────────────────────────────────────
document.getElementById('btn-toolbar-toggle').addEventListener('click', () => {
  const toolbar = document.getElementById('toolbar');
  const btn     = document.getElementById('btn-toolbar-toggle');
  toolbar.classList.toggle('collapsed');
  btn.textContent = toolbar.classList.contains('collapsed') ? '▼' : '▲';
});

document.getElementById('controls-header').addEventListener('click', () => {
  const panel = document.getElementById('controls');
  panel.classList.toggle('collapsed');
});

// ── Render mode ───────────────────────────────────────────────────────────────
document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const mode=btn.dataset.mode;
    meshes.forEach(m=>{m.material.wireframe=(mode==='wireframe');});
    edgeObjects.forEach(e=>{e.visible=(mode==='edges');});
  });
});

// ── Explode ───────────────────────────────────────────────────────────────────
const explodeSlider = document.getElementById('explodeSlider');
const explodeVal    = document.getElementById('explodeVal');
const explodeRow    = document.getElementById('explode-row');
let explodeMaxDist  = 1;

function initExplode(modelSize) {
  explodeMaxDist = modelSize * 1.2;
  meshes.forEach(mesh => {
    const worldBox    = new THREE.Box3().setFromObject(mesh);
    const worldCenter = worldBox.getCenter(new THREE.Vector3());
    const dir = worldCenter.clone();
    if (dir.lengthSq() < 1e-8) dir.set(0,1,0);
    dir.normalize();
    mesh.userData.explodeOriginLocal = mesh.position.clone();
    mesh.userData.explodeDir         = dir;
  });
}

function applyExplode(t) {
  meshes.forEach(mesh => {
    if (!mesh.userData.explodeOriginLocal) return;
    mesh.position.copy(mesh.userData.explodeOriginLocal)
      .addScaledVector(mesh.userData.explodeDir, t * explodeMaxDist);
  });
}

explodeSlider.addEventListener('input', () => {
  const t = Number(explodeSlider.value);
  applyExplode(t);
  explodeVal.textContent = Math.round(t*100) + '%';
});

// ── Camera animation ──────────────────────────────────────────────────────────
function animateCameraTo(targetPos, targetUp, onDone) {
  if (cameraAnim) { cameraAnim.cancelled=true; }
  const anim={cancelled:false};
  cameraAnim=anim;
  const DURATION=550, startTime=performance.now();
  const fromPos=perspCam.position.clone(), fromUp=perspCam.up.clone();
  const fromUpQ=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),fromUp.clone().normalize());
  const toUpQ  =new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),targetUp.clone().normalize());
  const dist=fromPos.length(), toDir=targetPos.clone().normalize(), fromDir=fromPos.clone().normalize();
  const posFromQ=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1),fromDir);
  const posToQ  =new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1),toDir);
  const ease=t=>t<.5?2*t*t:-1+(4-2*t)*t;
  controls.enabled=false;
  function step(){
    if (anim.cancelled){controls.enabled=true;return;}
    const raw=Math.min((performance.now()-startTime)/DURATION,1), t=ease(raw);
    perspCam.position.copy(new THREE.Vector3(0,0,1).applyQuaternion(posFromQ.clone().slerp(posToQ,t)).multiplyScalar(dist));
    perspCam.up.set(0,1,0).applyQuaternion(fromUpQ.clone().slerp(toUpQ,t)).normalize();
    perspCam.lookAt(0,0,0); perspCam.updateProjectionMatrix();
    if (isOrtho) applyProjection();
    controls.target.set(0,0,0);
    if (raw<1){requestAnimationFrame(step);}
    else {
      perspCam.position.copy(toDir.multiplyScalar(dist));
      perspCam.up.copy(targetUp); perspCam.lookAt(0,0,0);
      if (isOrtho) applyProjection();
      controls.enabled=true; controls.update(); cameraAnim=null;
      if (onDone) onDone();
    }
  }
  requestAnimationFrame(step);
}

// ── Виды камеры ───────────────────────────────────────────────────────────────
function setCameraView(name) {
  const box=perspCam.userData.modelBox; if (!box) return;
  const sz=new THREE.Vector3(); box.getSize(sz);
  const dist=Math.max(sz.x,sz.y,sz.z)*2.2;

  if (activeView===name) viewFlipped[name]=!viewFlipped[name];
  else viewFlipped[name]=false;

  const flip=viewFlipped[name]?-1:1;
  let dir, up, label;
  if (name==='top')        { dir=new THREE.Vector3(0,flip,0); up=new THREE.Vector3(0,0,-1); label=flip>0?'ВИД СВЕРХУ  ·  ⊥ XZ':'ВИД СНИЗУ  ·  ⊥ XZ'; }
  else if (name==='front') { dir=new THREE.Vector3(0,0,flip); up=new THREE.Vector3(0,1,0);  label=flip>0?'ВИД СПЕРЕДИ  ·  ⊥ XY':'ВИД СЗАДИ  ·  ⊥ XY'; }
  else                     { dir=new THREE.Vector3(flip,0,0); up=new THREE.Vector3(0,1,0);  label=flip>0?'ВИД СПРАВА  ·  ⊥ YZ':'ВИД СЛЕВА  ·  ⊥ YZ'; }

  document.querySelectorAll('.view-btn').forEach(b=>{
    b.classList.remove('active');
    const n=b.id.replace('btn-view-','');
    if (viewLabels[n]) b.textContent=viewLabels[n];
  });
  const btn=document.getElementById('btn-view-'+name);
  btn?.classList.add('active');
  if (btn) btn.textContent=viewFlipped[name]?viewLabels[name]:'↺';
  activeView=name;
  if (isOrtho) applyProjection();
  animateCameraTo(dir.multiplyScalar(dist),up,null);
  setStatus(label,true);
}

document.getElementById('btn-view-top').addEventListener('click',   ()=>setCameraView('top'));
document.getElementById('btn-view-front').addEventListener('click',  ()=>setCameraView('front'));
document.getElementById('btn-view-right').addEventListener('click',  ()=>setCameraView('right'));

document.getElementById('btn-reset').addEventListener('click',()=>{
  clearActiveView();
  animateCameraTo(defaultCameraPos,new THREE.Vector3(0,1,0),null);
  setStatus('КАМЕРА СБРОШЕНА',true);
});
document.getElementById('btn-ortho').addEventListener('click',()=>{
  isOrtho=!isOrtho;
  document.getElementById('btn-ortho').classList.toggle('active',isOrtho);
  applyProjection();
  setStatus(isOrtho?'ОРТОГОНАЛЬНАЯ ПРОЕКЦИЯ':'ПЕРСПЕКТИВНАЯ ПРОЕКЦИЯ',true);
});
document.getElementById('btn-grid').addEventListener('click',()=>{
  grid.visible=!grid.visible;
  document.getElementById('btn-grid').classList.toggle('active',grid.visible);
});
document.getElementById('btn-bg').addEventListener('click',()=>{
  isLightBg=!isLightBg;
  scene.background=new THREE.Color(isLightBg?0xf2f2f2:0x0d0d0f);
  document.body.style.background=isLightBg?'#f2f2f2':'#0d0d0f';
  kl.intensity=isLightBg?.9:1.2; fl.intensity=isLightBg?.3:.4; rl.intensity=isLightBg?.2:.3;
  document.getElementById('btn-bg').classList.toggle('active',isLightBg);
});

// ── UI refs ───────────────────────────────────────────────────────────────────
const progressBar=document.getElementById('progress-bar'), statusEl=document.getElementById('status');
const dimsEl=document.getElementById('dims'), controlsPanel=document.getElementById('controls');
const errorEl=document.getElementById('error');
function setStatus(msg,hide=false){
  statusEl.textContent=msg; statusEl.classList.remove('hidden');
  if (hide) setTimeout(()=>statusEl.classList.add('hidden'),1800);
}

// ── Load model ────────────────────────────────────────────────────────────────
const initialModel=new URLSearchParams(location.search).get('model');
if (initialModel) loadModel(initialModel);
else setStatus('НЕТ МОДЕЛИ — ПРОВЕРЬТЕ QR-КОД');

function resetClipUI() {
  clipIntersectionMode = false;
  document.getElementById('clip-mode-row').style.display = 'none';
  document.getElementById('btn-clip-and').classList.add('active');
  document.getElementById('btn-clip-or').classList.remove('active');
  ['xy','xz','yz'].forEach(axis => {
    const s = clipState[axis];
    s.active=false; s.inverted=true; s.value=0;
    s.plane.normal.copy(AXIS_NORMALS[axis]);
    s.plane.constant=0;
    document.querySelector(`.axis-btn[data-axis="${axis}"]`)?.classList.remove('active');
    document.getElementById('clip-row-'+axis).style.display='none';
    const sl=document.getElementById('clipSlider-'+axis);
    const vl=document.getElementById('sliderVal-'+axis);
    if (sl) sl.value=0;
    if (vl) vl.textContent='0.0';
    const inv=document.querySelector(`.invert-btn[data-axis="${axis}"]`);
    if (inv){inv.style.color='';inv.style.borderColor='';}
    const tr=document.getElementById('toggleTrack-'+axis);
    tr?.classList.remove('on');
    showPlaneVis[axis]=false;
    if (planeMeshes[axis]) planeMeshes[axis].visible=false;
  });
}

function loadModel(src) {
  meshes.forEach(m=>{try{m.geometry.dispose();m.material.dispose();}catch(e){}});
  edgeObjects.forEach(e=>{try{e.geometry.dispose();e.material.dispose();}catch(e){}});
  meshes=[]; edgeObjects=[];
  scene.children.filter(c=>c.userData.isModel).forEach(c=>scene.remove(c));

  // Удаляем старые визуальные плоскости
  Object.values(planeMeshes).forEach(pm=>{scene.remove(pm); pm.geometry.dispose(); pm.material.dispose();});
  planeMeshes={};

  resetClipUI();

  explodeSlider.value=0; explodeVal.textContent='0%'; explodeRow.style.display='none';
  controlsPanel.classList.add('disabled');
  errorEl.style.display='none'; progressBar.style.width='0%';
  setStatus('ЗАГРУЗКА...');
  document.getElementById('model-name').textContent=src.split('/').pop().split('?')[0];

  new GLTFLoader().load(src,
    (gltf)=>{
      const model=gltf.scene;
      model.userData.isModel=true;
      scene.add(model);

      model.traverse(child=>{
        if (!child.isMesh) return;
        if (!child.material) child.material=new THREE.MeshStandardMaterial({color:0x888888});
        if (!child.material.clippingPlanes) child.material.clippingPlanes=[];
        meshes.push(child);
        const el=new THREE.LineSegments(
          new THREE.EdgesGeometry(child.geometry,15),
          new THREE.LineBasicMaterial({color:0x000000,clippingPlanes:[],transparent:true,opacity:.7})
        );
        el.visible=false; child.add(el); edgeObjects.push(el);
      });

      const box=new THREE.Box3().setFromObject(model);
      const center=box.getCenter(new THREE.Vector3());
      const size=box.getSize(new THREE.Vector3());
      const maxDim=Math.max(size.x,size.y,size.z);

      model.position.sub(center);
      scene.updateMatrixWorld(true);

      dimsEl.textContent=`${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)}`;
      grid.position.y=box.min.y-center.y;
      perspCam.userData.modelBox=new THREE.Box3(box.min.clone().sub(center),box.max.clone().sub(center));

      // Создаём визуальную плоскость для каждой оси — у каждой свой цвет
      const pSize=maxDim*1.5;
      const planeColors={xy:0xff3333, xz:0x4f8ef7, yz:0x33cc66};
      const rotations={xy:[0,0,0], xz:[Math.PI/2,0,0], yz:[0,Math.PI/2,0]};
      ['xy','xz','yz'].forEach(axis=>{
        const color=planeColors[axis];
        const rot=rotations[axis];

        // Полупрозрачная заливка
        const pm=new THREE.Mesh(
          new THREE.PlaneGeometry(pSize,pSize),
          new THREE.MeshBasicMaterial({color,transparent:true,opacity:.08,side:THREE.DoubleSide,depthWrite:false})
        );
        pm.rotation.set(...rot);
        pm.visible=false;
        scene.add(pm);
        planeMeshes[axis]=pm;

        // Рамка по периметру — LineLoop из 4 углов плоскости
        const h=pSize/2;
        const borderGeo=new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(-h,-h,0),
          new THREE.Vector3( h,-h,0),
          new THREE.Vector3( h, h,0),
          new THREE.Vector3(-h, h,0),
        ]);
        const border=new THREE.LineLoop(
          borderGeo,
          new THREE.LineBasicMaterial({color, linewidth:2})
        );
        // Чуть выдвигаем вперёд чтобы не z-fighting с заливкой
        border.position.z=0.001;
        pm.add(border);   // прикрепляем к плоскости — двигаются вместе

        // Крестообразные направляющие линии через центр — помогают
        // визуально оценить где именно проходит плоскость
        const guideGeo=new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(-h,0,0), new THREE.Vector3(h,0,0),
          new THREE.Vector3(0,-h,0), new THREE.Vector3(0,h,0),
        ]);
        const guide=new THREE.LineSegments(
          guideGeo,
          new THREE.LineBasicMaterial({color,transparent:true,opacity:.35})
        );
        guide.position.z=0.001;
        pm.add(guide);

        // Настраиваем диапазон слайдеров
        const sl=document.getElementById('clipSlider-'+axis);
        if (sl){sl.min=-maxDim/2; sl.max=maxDim/2; sl.step=maxDim/400; sl.value=0;}
      });

      if (meshes.length>1){initExplode(maxDim); explodeRow.style.display='flex';}

      const dist=maxDim*2.2;
      defaultCameraPos.set(dist*.7,dist*.5,dist); defaultTarget.set(0,0,0);
      perspCam.position.copy(defaultCameraPos); perspCam.up.set(0,1,0);
      perspCam.near=maxDim*.001; perspCam.far=maxDim*100; perspCam.updateProjectionMatrix();
      controls.target.copy(defaultTarget); controls.update();

      progressBar.style.width='100%';
      setTimeout(()=>{progressBar.style.width='0%';},600);
      controlsPanel.classList.remove('disabled');
      setStatus(meshes.length>1?`ГОТОВО · ${meshes.length} ДЕТАЛЕЙ`:'ГОТОВО',true);
    },
    (xhr)=>{
      // FIX: xhr.total может быть 0 или некорректным — ограничиваем 99%
      // чтобы прогресс не перевалил за 100% до вызова onLoad
      if (xhr.total>0){
        const pct=Math.min(Math.round(xhr.loaded/xhr.total*100), 99);
        progressBar.style.width=pct+'%';
        setStatus(`ЗАГРУЗКА ${pct}%`);
      }
    },
    (err)=>{
      progressBar.style.width='0%'; statusEl.classList.add('hidden');
      errorEl.style.display='block';
      document.getElementById('err-sub').textContent=err.message||'Файл не найден или повреждён';
      console.error('GLTFLoader error:',err);
    }
  );
}

// ── Animate ───────────────────────────────────────────────────────────────────
function animate(){
  requestAnimationFrame(animate);
  if (isOrtho) applyProjection();

  // Двигаем визуальные плоскости вслед за слайдерами
  ['xy','xz','yz'].forEach(axis=>{
    const pm=planeMeshes[axis];
    if (!pm||!clipState[axis].active) return;
    const s=clipState[axis];
    pm.position.copy(s.plane.normal).multiplyScalar(-s.plane.constant);
  });

  controls.update();
  renderer.render(scene,camera);
}
animate();

// ── Resize ────────────────────────────────────────────────────────────────────
function onResize(){
  const w=vw(),h=vh();
  perspCam.aspect=w/h;
  if (!isOrtho) perspCam.updateProjectionMatrix(); else applyProjection();
  renderer.setSize(w,h); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
}
window.addEventListener('resize',onResize);
if (window.visualViewport) window.visualViewport.addEventListener('resize',onResize);
</script>
