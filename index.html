<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Viewer</title>

<script>
window.__supportsImportMap = false;
try {
  const s = document.createElement('script');
  s.type = 'importmap';
  if (HTMLScriptElement.supports && HTMLScriptElement.supports('importmap')) {
    window.__supportsImportMap = true;
  }
} catch(e) {}
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d0d0f;
  --panel: rgba(16,16,20,0.82);
  --border: rgba(255,255,255,0.08);
  --text: #e8e6e0;
  --muted: #7a7870;
  --accent: #4f8ef7;
  --accent2: #2dd4bf;
  --danger: #f97316;
  --radius: 10px;
  --font: 'DM Mono', monospace;
}
body { margin:0; overflow:hidden; background:var(--bg); font-family:var(--font); color:var(--text); }
canvas { display:block; touch-action:none; }

.panel {
  position:absolute;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

/* toolbar */
#toolbar {
  top:14px; right:14px;
  padding:6px;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.tb-group { display:flex; gap:4px; }
.tb-btn {
  width:36px; height:36px;
  border:1px solid var(--border);
  border-radius:8px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:13px;
}
.tb-btn:hover { color:#fff; }
.tb-btn.active { color:var(--accent); border-color:var(--accent); }

</style>
</head>
<body>

<div id="toolbar" class="panel">
  <div class="tb-group">
    <button class="tb-btn" id="btn-reset">⌂</button>
    <button class="tb-btn" id="btn-ortho">⊡</button>
    <button class="tb-btn" id="btn-grid">⊞</button>
  </div>

  <!-- NEW: camera views -->
  <div class="tb-group">
    <button class="tb-btn" id="view-xy">XY</button>
    <button class="tb-btn" id="view-xz">XZ</button>
    <button class="tb-btn" id="view-yz">YZ</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.01, 1000);
camera.position.set(3,3,3);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);

const grid = new THREE.GridHelper(10,10);
scene.add(grid);

const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(5,10,7);
scene.add(light);

const box = new THREE.Mesh(
  new THREE.BoxGeometry(),
  new THREE.MeshStandardMaterial({ color:0x4f8ef7 })
);
scene.add(box);

let target = new THREE.Vector3(0,0,0);

/* ========= NEW CAMERA VIEWS ========= */
function setView(axis){
  const dist = 5;

  if(axis === 'xy'){
    camera.position.set(0,0,dist);
    camera.up.set(0,1,0);
  }
  if(axis === 'xz'){
    camera.position.set(0,dist,0);
    camera.up.set(0,0,-1);
  }
  if(axis === 'yz'){
    camera.position.set(dist,0,0);
    camera.up.set(0,1,0);
  }

  camera.lookAt(target);
  controls.target.copy(target);
  controls.update();
}

/* buttons */
document.getElementById('view-xy').onclick = ()=>setView('xy');
document.getElementById('view-xz').onclick = ()=>setView('xz');
document.getElementById('view-yz').onclick = ()=>setView('yz');

/* original buttons preserved */
document.getElementById('btn-reset').onclick = ()=>{
  camera.position.set(3,3,3);
  controls.update();
};

document.getElementById('btn-grid').onclick = ()=>{
  grid.visible = !grid.visible;
};

document.getElementById('btn-ortho').onclick = ()=>{
  alert('орто режим в оригинальном коде (оставлен как есть)');
};

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

</script>
</body>
</html>
